[project]
name = "chainindent"
version = "0.1.0"
description = "Format pandas and Polars chains in Python, Markdown, and notebooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
chainindent = "chainindent.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ty>=0.0.101",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/chainindent"]
addopts = "--doctest-modules"
